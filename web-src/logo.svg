<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Scanner Glow Effect -->
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Glass Glow Overlay -->
    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGradient)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#glassGlow)" />

  <!-- Document / Lens Frame -->
  <rect x="120" y="110" width="272" height="292" rx="24" fill="#0F172A" fill-opacity="0.85" stroke="#818CF8" stroke-width="6" stroke-opacity="0.4" />

  <!-- Document Text Lines -->
  <!-- Line 1 (Header) -->
  <rect x="160" y="160" width="120" height="18" rx="9" fill="#38BDF8" />
  <rect x="296" y="160" width="56" height="18" rx="9" fill="#818CF8" />

  <!-- Line 2 -->
  <rect x="160" y="200" width="192" height="14" rx="7" fill="#94A3B8" fill-opacity="0.8" />

  <!-- Line 3 -->
  <rect x="160" y="234" width="150" height="14" rx="7" fill="#94A3B8" fill-opacity="0.8" />

  <!-- Line 4 -->
  <rect x="160" y="268" width="176" height="14" rx="7" fill="#94A3B8" fill-opacity="0.6" />

  <!-- Scanner Reticle Corners -->
  <!-- Top Left -->
  <path d="M 100 160 L 100 130 C 100 113.43 113.43 100 130 100 L 160 100" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Top Right -->
  <path d="M 352 100 L 382 100 C 398.57 100 412 113.43 412 130 L 412 160" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

  <!-- Bottom Left -->
  <path d="M 100 352 L 100 382 C 100 398.57 113.43 412 130 412 L 160 412" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

  <!-- Bottom Right -->
  <path d="M 352 412 L 382 412 C 398.57 412 412 398.57 412 382 L 412 352" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

  <!-- Laser Scan Beam Line -->
  <line x1="80" y1="310" x2="432" y2="310" stroke="url(#scanLine)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <line x1="120" y1="310" x2="392" y2="310" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

  <!-- Optical Lens / OCR Target Core -->
  <circle cx="330" cy="330" r="32" fill="#4F46E5" stroke="#38BDF8" stroke-width="6" filter="url(#glow)" />
  <path d="M 322 330 L 338 330 M 330 322 L 330 338" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
</svg>
